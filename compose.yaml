services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: newslens
      POSTGRES_PASSWORD: newslens
      POSTGRES_DB: newslens
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newslens -d newslens"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
